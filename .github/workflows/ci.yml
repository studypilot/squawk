name: CI

on:
   pull_request:
   push:
      branches: [main]

permissions:
   contents: read

jobs:
   checks:
      name: Typecheck, lint, test, build
      runs-on: ubuntu-24.04-arm
      steps:
         - uses: actions/checkout@v6
         - uses: pnpm/action-setup@v5
         - uses: actions/setup-node@v6
           with:
              node-version: 22
              cache: pnpm
         - run: pnpm install --frozen-lockfile
         - run: pnpm format:check
         - run: pnpm lint
         - run: pnpm typecheck
         - run: pnpm test
         - run: pnpm build
         - name: Build the server image
           run: docker build -f deploy/Dockerfile -t squawk:ci .
